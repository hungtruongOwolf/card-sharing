# Authorization matrix (SR-5): machine-readable copy of the permissions matrix in
# context/wiki/product/prd-mvp.md and the auth column of context/wiki/architecture/api-mvp.md.
#
# One row per registered route (method + route template, exactly as in OpenAPI). The harness
# (apps/api/tests/authz_matrix.rs) fails when a registered route has no row, or a row names a
# route that does not exist. Every cell runs against the real API with fresh fixture users.
#
# Roles available today (more join with the social, cards and boards tickets: owner, friend,
# non_friend, collaborator, minor, moderator):
#   guest               no token
#   onboarding_age      onboarding session, account pending_age
#   onboarding_profile  onboarding session, account pending_profile (age gate passed)
#   user                full session, account active
#   suspended           session of a suspended account
#   service             the web server: valid X-Service-Credential + X-Client-IP, no bearer token.
#                       Optional cell: when a row omits it, the harness expects 403 (deny by default;
#                       only svc routes under /v1/public/ accept the credential).
#
# Placeholders in `body`: "$REFRESH_TOKEN" = the role's own refresh token (guest: a random one),
# "$ADULT_DOB" = a date of birth 30 years ago, "$NONCE" = a fresh raw nonce, "$APPLE_ID_TOKEN" = an
# Apple ID token for a new subject and that nonce, signed by the mock JWKS key, "$GOOGLE_ID_TOKEN" = the
# same for Google, "$HANDLE" = a fresh random valid handle, "$EMAIL" = a fresh address,
# "$CODE_CHALLENGE" = a fresh PKCE S256 challenge, "$UUID_V7" = a fresh UUIDv7 (client-generated ids).
# `path` (optional) is the concrete path to call when the route has parameters; "$SESSION_ID" = the
# role's own session id (guest: a random id).
# `idempotency_key: true` sends a fresh Idempotency-Key with every request (routes that require one).
# A cell expecting 404 must give `missing_path` (same route, nonexistent id): the harness
# asserts the denial body is byte-identical to the missing-id body, so ids cannot be probed.
version: 1

routes:
  - route: GET /healthz
    expect: { guest: 200, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 200 }

  - route: GET /readyz
    expect: { guest: 200, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 200 }

  - route: GET /openapi.json
    expect: { guest: 200, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 200 }

  - route: GET /v1/config
    expect: { guest: 200, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 200 }

  # Sign-in ignores any bearer token: every caller gets a session for the identity in the ID token.
  # Invalid tokens (401), replay, rate limit and unknown fields are covered in tests/api/sign_in.rs and
  # tests/api/sign_in_google.rs.
  - route: POST /v1/auth/apple
    body: { id_token: $APPLE_ID_TOKEN, nonce: $NONCE }
    expect: { guest: 200, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 200 }

  - route: POST /v1/auth/google
    body: { id_token: $GOOGLE_ID_TOKEN, nonce: $NONCE }
    expect: { guest: 200, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 200 }

  # Magic links (T-22): always 202, no account information. Limits and delivery: tests/api/magic_link.rs.
  - route: POST /v1/auth/email/start
    body: { email: $EMAIL, code_challenge: $CODE_CHALLENGE }
    expect: { guest: 202, onboarding_age: 202, onboarding_profile: 202, user: 202, suspended: 202 }

  # T-26: a proof for a new subject is never the caller's own account (401). Own proofs, replays,
  # expiry and the `re` check are in tests/api/reauth.rs.
  - route: POST /v1/auth/reauth
    body: { provider: apple, id_token: $APPLE_ID_TOKEN, nonce: $NONCE }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 401, suspended: 403 }

  - route: POST /v1/auth/refresh
    body: { refresh_token: $REFRESH_TOKEN }
    expect: { guest: 401, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 401 }

  - route: DELETE /v1/sessions/current
    expect: { guest: 401, onboarding_age: 204, onboarding_profile: 204, user: 204, suspended: 403 }

  # Session management (T-24). Other accounts' session ids -> 404 (tests/api/session_management.rs).
  - route: GET /v1/sessions
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: DELETE /v1/sessions/{id}
    path: /v1/sessions/$SESSION_ID
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 204, suspended: 403 }

  - route: POST /v1/sessions/revoke-all
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 204, suspended: 403 }

  # Notification preferences (T-87). Always the caller's own; there is no id to point elsewhere.
  # Defaults, toggles, quiet hours and validation: tests/api/notification_preferences.rs.
  - route: GET /v1/me/notification-preferences
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: PUT /v1/me/notification-preferences
    body:
      {
        types: { card_new: true, reaction: true, friend: true, card_review: true },
        quiet_hours: { enabled: true, start: '22:00', end: '08:00' },
        time_zone: null,
      }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Push tokens (T-85). Only the calling session's own device; any other device id (another
  # account's included) is the same 404. Registration, moves, logout: tests/api/push_tokens.rs.
  - route: PUT /v1/devices/{deviceId}/push-tokens
    path: /v1/devices/0192f0c1-7c1e-7a3b-9d2e-123456789abc/push-tokens
    missing_path: /v1/devices/0192f0c1-7c1e-7a3b-9d2e-000000000000/push-tokens
    body:
      {
        provider: apns,
        kind: alert,
        token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
      }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: DELETE /v1/devices/{deviceId}/push-tokens
    path: /v1/devices/0192f0c1-7c1e-7a3b-9d2e-123456789abc/push-tokens
    missing_path: /v1/devices/0192f0c1-7c1e-7a3b-9d2e-000000000000/push-tokens
    expect: { guest: 401, onboarding_age: 404, onboarding_profile: 404, user: 404, suspended: 403 }

  # Attestation (T-35). Challenge single use, binding and verdicts: tests/api/attestation.rs. A bogus key
  # registration answers 204 in log-only mode (the test env's mode).
  - route: POST /v1/attestation/challenge
    expect: { guest: 401, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 403 }

  - route: POST /v1/attestation/apple-keys
    body: { key_id: $NONCE, attestation: AAAA, challenge: $NONCE }
    expect: { guest: 401, onboarding_age: 204, onboarding_profile: 204, user: 204, suspended: 403 }

  - route: GET /v1/me
    expect: { guest: 401, onboarding_age: 200, onboarding_profile: 200, user: 200, suspended: 403 }

  - route: POST /v1/me/age
    body: { birth_date: $ADULT_DOB }
    expect: { guest: 401, onboarding_age: 200, onboarding_profile: 403, user: 403, suspended: 403 }

  # OS age signal (T-29): enabled in the test env; the disabled flag (404) is in tests/api/age_service.rs.
  - route: POST /v1/me/age-signal
    body: { source: apple_declared_age_range, signal: minor }
    expect: { guest: 401, onboarding_age: 204, onboarding_profile: 204, user: 204, suspended: 403 }

  # Profile writes need the age gate passed (pending_age -> 403 ONBOARDING_INCOMPLETE). No account id is
  # accepted; the other-user and validation cases are in tests/api/profile.rs.
  - route: PUT /v1/me/profile
    body: { display_name: Matrix Cat }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 200, user: 200, suspended: 403 }

  # Handles: same gate as the profile. Taken/reserved/cooldown/race cases are in tests/api/handle.rs.
  - route: POST /v1/me/handle/check
    body: { handle: $HANDLE }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 200, user: 200, suspended: 403 }

  - route: PUT /v1/me/handle
    body: { handle: $HANDLE }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 200, user: 200, suspended: 403 }

  # Invites (T-37). Only the caller's own invite exists on these routes (no id); another user's link
  # and reset isolation are in tests/api/invites.rs.
  - route: GET /v1/me/invite
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: POST /v1/me/invite/reset
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Friend requests (T-39). An unknown token is the same 404 for every caller; expired, self, blocked
  # (silent 201), caps and attestation are in tests/api/friend_requests.rs.
  - route: GET /v1/invites/{token}
    path: /v1/invites/AAAAAAAAAAAAAAAAAAAAAA
    missing_path: /v1/invites/BBBBBBBBBBBBBBBBBBBBBB
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # #234: svc only (the web landing page). Bad tokens of every kind: tests/api/public_invites.rs.
  - route: GET /v1/public/invites/{token}
    path: /v1/public/invites/AAAAAAAAAAAAAAAAAAAAAA
    missing_path: /v1/public/invites/BBBBBBBBBBBBBBBBBBBBBB
    expect:
      guest: 401
      onboarding_age: 401
      onboarding_profile: 401
      user: 401
      suspended: 401
      service: 404

  # T-131: svc only (the web share page). Bad tokens of every kind, throttling and anomalies:
  # tests/api/public_boards.rs.
  - route: GET /v1/public/boards/{token}
    path: /v1/public/boards/AAAAAAAAAAAAAAAAAAAAAA
    missing_path: /v1/public/boards/BBBBBBBBBBBBBBBBBBBBBB
    expect:
      guest: 401
      onboarding_age: 401
      onboarding_profile: 401
      user: 401
      suspended: 401
      service: 404

  - route: GET /v1/public/boards/{token}/og
    path: /v1/public/boards/AAAAAAAAAAAAAAAAAAAAAA/og
    missing_path: /v1/public/boards/BBBBBBBBBBBBBBBBBBBBBB/og
    expect:
      guest: 401
      onboarding_age: 401
      onboarding_profile: 401
      user: 401
      suspended: 401
      service: 404

  - route: POST /v1/friend-requests
    body: { invite_token: AAAAAAAAAAAAAAAAAAAAAA }
    missing_path: /v1/friend-requests
    idempotency_key: true
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Answering requests (T-40): a request id that is not the caller's is the same 404 as a missing one
  # (tests/api/request_answers.rs covers cross-user accept / decline / cancel).
  - route: GET /v1/friend-requests
    path: /v1/friend-requests?direction=incoming
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: POST /v1/friend-requests/{id}/accept
    path: /v1/friend-requests/0192f0c1-7c1e-7a3b-9d2e-123456789abc/accept
    missing_path: /v1/friend-requests/0192f0c1-7c1e-7a3b-9d2e-000000000000/accept
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: POST /v1/friend-requests/{id}/decline
    path: /v1/friend-requests/0192f0c1-7c1e-7a3b-9d2e-123456789abc/decline
    missing_path: /v1/friend-requests/0192f0c1-7c1e-7a3b-9d2e-000000000000/decline
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: DELETE /v1/friend-requests/{id}
    path: /v1/friend-requests/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/friend-requests/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Handle search (T-43). Every outcome is a 200; hidden accounts, refs and timing are in
  # tests/api/user_search.rs.
  - route: POST /v1/users/search
    body: { handle: $HANDLE }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Privacy settings (T-45). The matrix user has no DOB (treated as under the discovery age), so turning
  # findability off is the allowed cell; adults turning it on and minors refused are in
  # tests/api/findable.rs.
  - route: PATCH /v1/me/settings
    body: { findable_by_handle: false }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Friends (T-46). A user id that is not the caller's friend is the same 404 as a missing one
  # (tests/api/friends.rs covers third-party edges).
  - route: GET /v1/friends
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: DELETE /v1/friends/{userId}
    path: /v1/friends/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/friends/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Blocks (T-47). An unrelated or missing account is the same 404 (no existence oracle); relation
  # rules and silence are in tests/api/blocks.rs.
  - route: POST /v1/blocks
    body: { user_id: 0192f0c1-7c1e-7a3b-9d2e-123456789abc }
    missing_path: /v1/blocks
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: GET /v1/blocks
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: DELETE /v1/blocks/{userId}
    path: /v1/blocks/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/blocks/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Media uploads (T-70). The matrix sends no image, so allowed callers get 415 (no image content
  # type); sizes, magic bytes, header dimensions and dedupe are in tests/api/media.rs.
  - route: POST /v1/media
    path: /v1/media?kind=card_render
    expect: { guest: 401, onboarding_age: 415, onboarding_profile: 415, user: 415, suspended: 403 }

  # Another account's media id is the same 404 as a missing one; no URL is ever returned.
  - route: GET /v1/media/{id}
    path: /v1/media/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/media/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 404, onboarding_profile: 404, user: 404, suspended: 403 }

  # Signed media edge (T-74). No signature -> 403 for everyone; sessions are ignored (the signature
  # is the capability). Valid, expired and tampered URLs are in tests/api/media_urls.rs.
  - route: GET /v1/media-files/{key}
    path: /v1/media-files/0123456789abcdef0123456789abcdef
    expect: { guest: 403, onboarding_age: 403, onboarding_profile: 403, user: 403, suspended: 403 }

  # Send a card (T-75). The matrix body has no media, so allowed callers get 400; ownership (404),
  # silent recipient drops, replay and the daily cap are in tests/api/cards_send.rs.
  - route: POST /v1/cards
    body: { audience: { mode: all } }
    idempotency_key: true
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 400, suspended: 403 }

  # Read a card (T-79). A card the caller may not see is the same 404 as a missing id; the owner,
  # recipient, stranger, unfriended, blocked, suspended-sender and held/pending cells are in
  # tests/api/cards_read.rs.
  - route: GET /v1/cards/{id}
    path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Feed (part of #82). Visibility, order, cursor and per-viewer URLs are in tests/api/feed.rs.
  - route: GET /v1/feed
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Activity tab (T-88). Only the caller's own items; another user's item id is the same 404 as a
  # missing one (the id is in the body, so the byte-identical check is in tests/api/activity.rs).
  - route: GET /v1/activity
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: POST /v1/activity/read
    path: /v1/activity/read
    missing_path: /v1/activity/read
    body: { up_to: '0192f0c1-7c1e-7a3b-9d2e-123456789abc' }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Widget (T-91). A widget token opens GET /v1/widget only (403 elsewhere) and dies with its
  # parent session: tests/api/widget.rs.
  - route: POST /v1/me/widget-token
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 201, suspended: 403 }

  - route: GET /v1/widget
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Purge check (T-83). A card the caller may not see is purged like an unknown one; unfriend,
  # block and delete cells are in tests/api/feed_purges.rs.
  - route: POST /v1/feed/purges
    body: { card_ids: ['0192f0c1-7c1e-7a3b-9d2e-123456789abc'] }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  # Delete a card (T-82). Owner only; a recipient's, a stranger's, a missing or an already deleted
  # card is the same 404 (tests/api/cards_delete.rs).
  - route: DELETE /v1/cards/{id}
    path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Reactions (T-84). Non-recipients reacting and recipients listing are the same 404 as a missing
  # card; privacy between recipients is in tests/api/cards_reactions.rs.
  - route: PUT /v1/cards/{id}/reaction
    path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/reaction
    missing_path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-000000000000/reaction
    body: { kind: react.heart }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: DELETE /v1/cards/{id}/reaction
    path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/reaction
    missing_path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-000000000000/reaction
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: GET /v1/cards/{id}/reactions
    path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/reactions
    missing_path: /v1/cards/0192f0c1-7c1e-7a3b-9d2e-000000000000/reactions
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Boards (T-98). Collisions with another owner's id, the board cap and validation are in
  # tests/api/boards.rs; a non-member reading a board is the same 404 as a missing one.
  - route: POST /v1/boards
    body: { id: $UUID_V7, title: Matrix board }
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 201, suspended: 403 }

  - route: GET /v1/boards
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: GET /v1/boards/{id}
    path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Pin op batches (T-99). Per-op results, conflicts, pin ownership and replays are in
  # tests/api/board_ops.rs; a non-member's batch is the same 404 as for a missing board.
  - route: POST /v1/boards/{id}/ops
    path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/ops
    missing_path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-000000000000/ops
    body:
      ops:
        - type: pin.remove
          op_id: 0192f0c1-7c1e-7a3b-9d2e-0000000000aa
          pin_id: 0192f0c1-7c1e-7a3b-9d2e-0000000000bb
          base_version: 1
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Board members (T-102). The minor rule (display name only) is in tests/api/board_minor_rule.rs.
  - route: GET /v1/boards/{id}/members
    path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/members
    missing_path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-000000000000/members
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  # Board invitations (T-106). Non-friend targets, the cap, cooldowns, silent drops, someone else's
  # invitation and acceptance re-checks are in tests/api/board_invitations.rs.
  - route: POST /v1/boards/{id}/invitations
    path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/invitations
    missing_path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-000000000000/invitations
    body: { user_id: 0192f0c1-7c1e-7a3b-9d2e-0000000000cc }
    idempotency_key: true
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: GET /v1/boards/{id}/invitations
    path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-123456789abc/invitations
    missing_path: /v1/boards/0192f0c1-7c1e-7a3b-9d2e-000000000000/invitations
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: DELETE /v1/board-invitations/{id}
    path: /v1/board-invitations/0192f0c1-7c1e-7a3b-9d2e-123456789abc
    missing_path: /v1/board-invitations/0192f0c1-7c1e-7a3b-9d2e-000000000000
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: GET /v1/me/board-invitations
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 200, suspended: 403 }

  - route: POST /v1/board-invitations/{id}/accept
    path: /v1/board-invitations/0192f0c1-7c1e-7a3b-9d2e-123456789abc/accept
    missing_path: /v1/board-invitations/0192f0c1-7c1e-7a3b-9d2e-000000000000/accept
    expect: { guest: 401, onboarding_age: 403, onboarding_profile: 403, user: 404, suspended: 403 }

  - route: POST /v1/board-invitations/{id}/decline
    path: /v1/board-invitations/0192f0c1-7c1e-7a3b-9d2e-123456789abc/decline
