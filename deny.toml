# cargo-deny: supply-chain policy for the Rust workspace. CI: EmbarkStudios/cargo-deny-action.
# Local: `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisories (vulnerable, unmaintained, yanked) fail the build. Add an `ignore`
# entry only with a reason and an expiry ticket.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Our own crates are `publish = false` and UNLICENSED.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
