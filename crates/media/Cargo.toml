[package]
name = "media"
version = "0.1.0"
description = "Media pipeline: quarantine uploads, object storage port, processing and signed URLs (ADR-0005)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
platform.workspace = true
# HMAC-SHA256 for signed media URLs (already the workspace's crypto provider).
ring.workspace = true

base64.workspace = true
bytes.workspace = true
getrandom.workspace = true
# S3-compatible storage adapter (src/s3.rs): SigV4 over the same hyper + rustls (ring) client stack
# identity uses, instead of an SDK.
http.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
# The only image decoder/encoder (memory-safe, pure Rust): PNG, JPEG, WebP. Decoding runs only in
# the media worker's sandboxed task (src/pipeline.rs) with size, allocation and time limits.
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
