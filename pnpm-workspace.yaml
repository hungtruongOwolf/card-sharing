packages:
  - apps/mobile
  - apps/web
  - packages/*

# Symlink-free install layout. Works on filesystems without symlinks/hard links (e.g. exFAT external
# drives) and is the layout Expo recommends for pnpm with React Native / Metro.
# The package store stays in the default per-user location (on the system drive); node_modules get real copies.
# Internal packages are NOT declared as dependencies (pnpm always symlinks workspace packages, even with `file:` or
# `injected`). Apps import them through tsconfig `paths` (tsconfig.base.json, apps/mobile/tsconfig.json), which Next.js,
# Expo/Metro, tsc and dependency-cruiser all honour; turbo.json `globalDependencies` keeps caches correct.
nodeLinker: hoisted
packageImportMethod: copy

# pnpm 10 blocks dependency lifecycle scripts by default; allow-list only what is needed.
onlyBuiltDependencies:
  # copies prebuilt Skia native libs into the package (required for iOS/Android builds)
  - '@shopify/react-native-skia'

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.x declares typescript ^5 but works with the repo's TS 6
    openapi-typescript>typescript: '6'

# Reviewed advisories that `pnpm audit` (CI gate, high+) must not fail on. Each entry needs a reason and a re-check trigger.
auditConfig:
  ignoreGhsas:
    # decode-uri-component <=0.5.0 (DoS on crafted percent-encoding), via expo-router > query-string@7.
    # Only fix (0.5.1) is ESM-only and breaks query-string@7 (CJS). Input is the user's own deep link on their own device.
    # Re-check when expo-router drops query-string@7 (next Expo SDK upgrade).
    - GHSA-qr28-fpjm-wq7f
    # zod <4.6.6 (memory exhaustion on oversized collections), via expo > @expo/cli (zod@3). Dev tooling only, not in the
    # app bundle or any server. Re-check on the next Expo SDK upgrade.
    - GHSA-mrhx-c7xc-m3w5
