[workspace]
resolver = "3"
members = ["apps/api", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
# internal
identity = { path = "crates/identity" }
platform = { path = "crates/platform" }
policy = { path = "crates/policy" }

# external — keep versions here so every crate uses the same ones
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path", "original-uri"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
http = "1"
# HTTPS client for provider JWKS and Apple's token endpoint (crates/identity/src/oidc/http.rs). Plain
# hyper + hyper-rustls with our ring rustls config: reqwest's rustls mode always pulls a platform
# verifier with a CDLA-licensed root bundle and, by default, aws-lc.
bytes = "1.12.1"
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# ID-token (JWS) parsing and claim checks for Apple/Google sign-in. No built-in crypto backend: its
# `rust_crypto` backend pulls `rsa` (RUSTSEC-2023-0071, unpatched) and `aws_lc_rs` is OpenSSL-licensed,
# so identity installs a ring-backed RS256 verifier (crates/identity/src/oidc/ring_provider.rs).
jsonwebtoken = { version = "11.1.0", default-features = false }
# Test-only (identity `test-support`): RSA test keys without the `rsa` crate.
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script"] }
# TLS for Redis/Postgres uses rustls with the ring provider only (no aws-lc / OpenSSL-licensed code).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
ring = "0.17.14"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "set-header", "limit", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# Test-only RSA key generation (identity `test-support`) is too slow unoptimized.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
