# Shared text filter for display names, handles, captions and board titles (SR-28).
# Code: crates/platform/src/text.rs. Reviewed like code; changing a list changes what users may write.
#
# Matching runs on a folded key: compatibility forms, accents and case removed, Cyrillic/Greek look-alikes
# and digit/symbol substitutions (0->o, 1->i, 3->e, 4->a, 5->s, @->a, $->s) mapped to Latin letters.
#   words:    blocked when the text has a whole word equal to the term (safe for short terms that appear
#             inside innocent words: "Scunthorpe", "Cassandra", "cockatoo" pass)
#   contains: blocked when the term appears inside any word, or inside a spelled-out run of single letters
#             ("f.u.c.k"). Only for terms that rarely occur inside innocent words.
# Terms with no doubled letter also match stretched spellings ("fuuuck").
#
# This is a SEED list for the MVP. Moderation owns it: extend it from report data and a maintained list
# before launch. Never echo a matched term to the client (the API answers VALIDATION_FAILED).
version: 1

# Zalgo cap: combining marks kept per grapheme cluster (viramas are exempt: they link Indic conjuncts).
max_marks_per_grapheme: 4
# Grapheme clusters longer than this many code points are dropped (endless emoji ZWJ chains).
max_chars_per_grapheme: 16

