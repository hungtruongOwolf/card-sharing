# Rate limits (SR-23) — see crates/platform/src/rate_limit.rs and context/wiki/architecture/api-mvp.md.
#
# Each route policy names one limit here; startup fails if a referenced name is missing.
#   scope: user   -> per account (falls back to device, then client IP, for anonymous callers)
#          device -> per device (falls back to client IP)
#          ip     -> per client IP
#   on_store_failure: closed -> 503 SERVER_BUSY + Retry-After when Redis is slow or down (auth, guessable
#                             tokens, enumeration, staff, abuse-prone writes; the reviewed list is asserted by
#                             apps/api/tests/api/rate_limit.rs, see security-baseline.md "Rate limiter failure mode")
#                     open   -> per-instance memory bucket (every other limit)
#   new_account_requests: quota for accounts younger than new_account.days (defaults to requests)
#   global: circuit breaker shared by all callers of the limit
#   also: extra per-caller windows (e.g. a daily cap on top of a per-minute limit); all must pass
# Values are starting points from api-mvp.md; tune them from production metrics.
version: 1

new_account:
  days: 7

limits:
  auth.signin: # POST /v1/auth/apple, /v1/auth/google
    scope: ip
    requests: 10
    per_secs: 60
    on_store_failure: closed
    global: { requests: 3000, per_secs: 60 }
  auth.email.start: # POST /v1/auth/email/start, per IP (AC-1.2: 5 per 15 min)
    scope: ip
    requests: 5
    per_secs: 900
    on_store_failure: closed
    global: { requests: 2000, per_secs: 60 }
  auth.email.verify: # POST /v1/auth/email/verify (T-23; 10/min per IP; the 256-bit token and verifier are the real guard)
    scope: ip
    requests: 10
    per_secs: 60
    on_store_failure: closed
    global: { requests: 3000, per_secs: 60 }
  auth.reauth: # POST /v1/auth/reauth (5 per 15 minutes per user, SR-2)
    scope: user
    requests: 5
    per_secs: 900
    on_store_failure: closed
  auth.reauth.email.start: # POST /v1/auth/reauth/email/start (re-auth links, 5 per 15 minutes per user, ADR-0012)
    scope: user
    requests: 5
    per_secs: 900
    on_store_failure: closed
  auth.email.start.email: # same route, keyed by the hashed email (checked in the handler)
    scope: user
    requests: 5
    per_secs: 900
    on_store_failure: closed
  auth.dev: # GET /v1/dev/seed-users, POST /v1/dev/sign-in (development and test servers only, #306)
    scope: ip
    requests: 30
    per_secs: 60
    on_store_failure: closed
  public.reports.create: # POST /v1/public/reports (svc; 5/h per visitor IP from X-Client-IP, AC-26.3)
    scope: ip
    requests: 5
    per_secs: 3600
    on_store_failure: closed
  cards.appeal: # POST /v1/cards/{id}/appeal (T-148; one appeal per hold, 10/day per user)
    scope: user
    requests: 10
    per_secs: 86400
    on_store_failure: open
  reports.create: # POST /v1/reports (20/day per user, US-26)
    scope: user
    requests: 20
    per_secs: 86400
    on_store_failure: open
  admin.auth.login: # POST /v1/admin/auth/login (staff sign-in step one, 10 per 15 min per IP)
    scope: ip
    requests: 10
    per_secs: 900
    on_store_failure: closed
  admin.auth.mfa: # POST /v1/admin/auth/mfa (20 per 15 min per IP; each login token also allows only 5 codes)
    scope: ip
    requests: 20
    per_secs: 900
    on_store_failure: closed
  admin.session: # POST /v1/admin/auth/logout
    scope: user
    requests: 30
    per_secs: 60
    on_store_failure: open
  admin.actions: # POST /v1/admin/reports/{id}/actions (120/min per staff member)
    scope: user
    requests: 120
    per_secs: 60
    on_store_failure: closed
  admin.read: # staff reads (GET /v1/admin/*), 300/min per staff member
    scope: user
    requests: 300
    per_secs: 60
    on_store_failure: closed
  auth.refresh: # POST /v1/auth/refresh (30/h per device; anonymous callers fall back to IP)
    # Fails open to the per-instance memory bucket (EM 2026-11-07): refresh tokens are 256-bit and
    # single-use, so the limit only caps volume, and refusing refreshes while Valkey is down would
    # stall every signed-in user.
    scope: device
    requests: 30
    per_secs: 3600
    on_store_failure: open
  sessions.current.delete: # DELETE /v1/sessions/current
    scope: user
    requests: 30
    per_secs: 60
    on_store_failure: open
  sessions.list: # GET /v1/sessions
    scope: user
    requests: 30
    per_secs: 60
    on_store_failure: open
  sessions.revoke: # DELETE /v1/sessions/{id}
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  sessions.revoke_all: # POST /v1/sessions/revoke-all (logging out must keep working when Redis is down)
    scope: user
    requests: 10
    per_secs: 3600
    on_store_failure: open
  attestation.challenge: # POST /v1/attestation/challenge (30/min per device)
    scope: device
    requests: 30
    per_secs: 60
    on_store_failure: closed
  attestation.register: # POST /v1/attestation/apple-keys (one key per install; retries only)
    scope: device
    requests: 10
    per_secs: 86400
    on_store_failure: closed
  me.read: # GET /v1/me
    scope: user
    requests: 120
    per_secs: 60
    on_store_failure: open
  me.age: # POST /v1/me/age (5/day per device)
    scope: device
    requests: 5
    per_secs: 86400
    on_store_failure: closed
  me.age_signal: # POST /v1/me/age-signal (the app sends the OS signal at most on launch)
