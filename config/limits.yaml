    per_secs: 86400
    on_store_failure: closed
  me.settings.update: # PATCH /v1/me/settings
    scope: user
    requests: 20
    per_secs: 3600
    on_store_failure: open
  me.notification_preferences: # GET and PUT /v1/me/notification-preferences (T-87)
    # Per minute, like the other launch-time reads (me.read, feed.read): the app's TimeZoneSync reads the
    # preferences on every launch, web reload and new tab (sprint 10 B7: 30/h was used up by ordinary
