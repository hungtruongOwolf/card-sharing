    requests: 20
    per_secs: 3600
    on_store_failure: open
  me.handle.check: # POST /v1/me/handle/check (reveals taken/available only; fails closed)
    scope: user
    requests: 20
    per_secs: 60
    on_store_failure: closed
    also:
      - { requests: 100, per_secs: 86400 }
  me.handle.claim: # PUT /v1/me/handle
    scope: user
    requests: 10
    per_secs: 3600
    on_store_failure: closed
  invites.read: # GET /v1/me/invite
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  invites.reset: # POST /v1/me/invite/reset (AC-4.3)
    scope: user
    requests: 5
    per_secs: 86400
    on_store_failure: open
  invites.preview: # GET /v1/invites/{token} (per client IP: token guessing, SR-20)
    scope: ip
    requests: 30
    per_secs: 60
    on_store_failure: closed
  public.invites.read: # GET /v1/public/invites/{token} (svc; per visitor IP from X-Client-IP: token guessing, SR-20)
    scope: ip
    requests: 30
    per_secs: 60
    on_store_failure: closed
  public.boards.read: # GET /v1/public/boards/{token}[/og] (svc; per visitor IP from X-Client-IP, SR-16)
    scope: ip
    requests: 60
    per_secs: 60
    on_store_failure: closed
  public.boards.token: # same routes, per link (checked in the handler); exceeding it disables the link (anomaly)
