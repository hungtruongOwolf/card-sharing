# Rate limits (SR-23) — see crates/platform/src/rate_limit.rs and context/wiki/architecture/api-mvp.md.
#
# Each route policy names one limit here; startup fails if a referenced name is missing.
#   scope: user   -> per account (falls back to device, then client IP, for anonymous callers)
#          device -> per device (falls back to client IP)
#          ip     -> per client IP
#   on_store_failure: closed -> 503 when Redis is down (auth, search); open -> per-instance memory bucket
#   new_account_requests: quota for accounts younger than new_account.days (defaults to requests)
#   global: circuit breaker shared by all callers of the limit
#   also: extra per-caller windows (e.g. a daily cap on top of a per-minute limit); all must pass
# Values are starting points from api-mvp.md; tune them from production metrics.
version: 1

new_account:
  days: 7

limits:
  auth.signin: # POST /v1/auth/apple, /v1/auth/google
    scope: ip
    requests: 10
    per_secs: 60
    on_store_failure: closed
    global: { requests: 3000, per_secs: 60 }
  auth.email.start: # POST /v1/auth/email/start, per IP (AC-1.2: 5 per 15 min)
    scope: ip
    requests: 5
    per_secs: 900
    on_store_failure: closed
    global: { requests: 2000, per_secs: 60 }
  auth.email.start.email: # same route, keyed by the hashed email (checked in the handler)
    scope: user
    requests: 5
    per_secs: 900
    on_store_failure: closed
  auth.refresh: # POST /v1/auth/refresh (30/h per device; anonymous callers fall back to IP)
    scope: device
    requests: 30
    per_secs: 3600
    on_store_failure: closed
  sessions.current.delete: # DELETE /v1/sessions/current
    scope: user
    requests: 30
    per_secs: 60
    on_store_failure: open
  sessions.list: # GET /v1/sessions
    scope: user
    requests: 30
    per_secs: 60
    on_store_failure: open
  sessions.revoke: # DELETE /v1/sessions/{id}
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  sessions.revoke_all: # POST /v1/sessions/revoke-all (logging out must keep working when Redis is down)
    scope: user
    requests: 10
    per_secs: 3600
    on_store_failure: open
  attestation.challenge: # POST /v1/attestation/challenge (30/min per device)
    scope: device
    requests: 30
    per_secs: 60
    on_store_failure: closed
  attestation.register: # POST /v1/attestation/apple-keys (one key per install; retries only)
    scope: device
    requests: 10
    per_secs: 86400
    on_store_failure: closed
  me.read: # GET /v1/me
    scope: user
    requests: 120
    per_secs: 60
    on_store_failure: open
  me.age: # POST /v1/me/age (5/day per device)
    scope: device
    requests: 5
    per_secs: 86400
    on_store_failure: closed
  me.age_signal: # POST /v1/me/age-signal (the app sends the OS signal at most on launch)
    scope: user
    requests: 10
    per_secs: 86400
    on_store_failure: open
  me.profile.update: # PUT /v1/me/profile
    scope: user
    requests: 20
    per_secs: 3600
    on_store_failure: open
  me.handle.check: # POST /v1/me/handle/check (reveals taken/available only; fails closed)
    scope: user
    requests: 20
    per_secs: 60
    on_store_failure: closed
    also:
      - { requests: 100, per_secs: 86400 }
  me.handle.claim: # PUT /v1/me/handle
    scope: user
    requests: 10
    per_secs: 3600
    on_store_failure: closed
  invites.read: # GET /v1/me/invite
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  invites.reset: # POST /v1/me/invite/reset (AC-4.3)
    scope: user
    requests: 5
    per_secs: 86400
    on_store_failure: open
  invites.preview: # GET /v1/invites/{token} (per client IP: token guessing, SR-20)
    scope: ip
    requests: 30
    per_secs: 60
    on_store_failure: closed
  public.invites.read: # GET /v1/public/invites/{token} (svc; per visitor IP from X-Client-IP: token guessing, SR-20)
    scope: ip
    requests: 30
    per_secs: 60
    on_store_failure: closed
  friend_requests.create: # POST /v1/friend-requests (the 30/day product cap is enforced in the service, T-41)
    scope: user
    requests: 30
    per_secs: 86400
    on_store_failure: closed
  friend_requests.list: # GET /v1/friend-requests
    scope: user
    requests: 60
    per_secs: 60
    on_store_failure: open
  friend_requests.accept: # POST /v1/friend-requests/{id}/accept
    scope: user
    requests: 60
    per_secs: 3600
    on_store_failure: open
  friend_requests.decline: # POST /v1/friend-requests/{id}/decline
    scope: user
    requests: 60
    per_secs: 3600
    on_store_failure: open
  friend_requests.cancel: # DELETE /v1/friend-requests/{id}
    scope: user
    requests: 60
    per_secs: 3600
    on_store_failure: open
  users.search: # POST /v1/users/search per account (AC-5a.3: 10/min and 30/day; fails closed)
    scope: user
    requests: 10
    per_secs: 60
    new_account_requests: 5
    on_store_failure: closed
    also:
      - { requests: 30, per_secs: 86400 }
  users.search.device: # same route, per device (checked in the handler)
    scope: device
    requests: 30
    per_secs: 86400
    on_store_failure: closed
  users.search.ip: # same route, per client IP (checked in the handler; shared NATs get headroom)
    scope: ip
    requests: 100
    per_secs: 86400
    on_store_failure: closed
  me.settings.update: # PATCH /v1/me/settings
    scope: user
    requests: 20
    per_secs: 3600
    on_store_failure: open
  friends.list: # GET /v1/friends
    scope: user
    requests: 60
    per_secs: 60
    on_store_failure: open
  friends.remove: # DELETE /v1/friends/{userId}
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  blocks.create: # POST /v1/blocks
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  blocks.list: # GET /v1/blocks
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  blocks.remove: # DELETE /v1/blocks/{userId}
    scope: user
    requests: 30
    per_secs: 3600
    on_store_failure: open
  config.read: # GET /v1/config (CDN cached; this only bounds cache misses)
    scope: ip
    requests: 120
    per_secs: 60
    on_store_failure: open
  media.upload: # POST /v1/media (60/h + 300/day per user; avatars during onboarding too)
    scope: user
    requests: 60
    per_secs: 3600
    on_store_failure: open
    also:
      - { requests: 300, per_secs: 86400 }
  media.read: # GET /v1/media/{id}
    scope: user
    requests: 120
    per_secs: 60
    on_store_failure: open
  media.urls: # signed media URLs issued to one user (SR-10; charged per URL by the routes that return media)
    scope: user
    requests: 1000
    per_secs: 60
    on_store_failure: open
  media.files.read: # GET /v1/media-files/{key} (local edge for signed URLs; the CDN serves production)
    scope: ip
    requests: 1200
    per_secs: 60
    on_store_failure: open
  cards.create: # POST /v1/cards (AC-13.5: 100 sends per user per day)
    scope: user
    requests: 100
    per_secs: 86400
    on_store_failure: open
