# Region / jurisdiction policy — see context/wiki/architecture/region-policy.md
#
# Versioned and reviewed like code. Adding/changing a country = edit this file + add a test
# in crates/policy/tests. Resolution: country override > group override > default; when
# signals conflict (store / IP / declared country) the strictest value of each field wins.
#
# ALL VALUES ARE PLACEHOLDERS PENDING LEGAL REVIEW — only the mechanism is decided.
version: 1

default:
  min_age: 13
  adult_age: 18 # below this an account is a minor (minor protections, AgeService)
  discovery:
    min_age: 18 # handle search never returns younger accounts (US-5a)
  public_links: # public board links (US-24 AC-24.6); younger owners cannot create them
    min_age: 18
  invites: # personal invite links of minors (US-4 AC-4.4); strictest = smallest value
    minor_ttl_days: 7
    minor_max_uses: 5
  ai_effects:
    cloud_allowed: true
    min_age: 18 # cloud AI effects (genai-effects: Gemini API terms are 18+); younger accounts get no AI effects
    people_in_photo: on_device_or_non_gemini # any | on_device_or_non_gemini | on_device_only
  ads:
    rewarded: true
    personalized_requires_consent: false
  ai_label:
    visible_badge: true
    c2pa: true

groups:
  # EU member states. Open question: extend to EEA (IS, LI, NO) for GDPR purposes?
  EU:
    [
      AT,
      BE,
      BG,
      HR,
      CY,
      CZ,
      DK,
      EE,
      FI,
      FR,
      DE,
      GR,
      IE,
      IT,
      LV,
      LT,
      LU,
      MT,
      NL,
      PL,
      PT,
      RO,
      SK,
      SI,
      ES,
      SE,
      HU,
    ]

overrides:
  EU: # GDPR Art. 8 (member states choose 13–16) — legal review
    min_age: 16
    ads:
      personalized_requires_consent: true
  GB: # United Kingdom (ISO 3166-1 code is GB, not UK) — Age Appropriate Design Code — review
    min_age: 13
  US: # COPPA
    min_age: 13
  KR: # PIPA — verify; civil age of majority is 19
    min_age: 14
    adult_age: 19
    discovery:
      min_age: 19
    public_links:
      min_age: 19
