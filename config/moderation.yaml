# Moderation rules (US-26, US-27, SR-31) — see crates/moderation/src/settings.rs and
# context/wiki/architecture/api-mvp.md "Safety, moderation". Report rate limits live in
# config/limits.yaml. Reports never trigger an automatic action.
version: 1

reports:
  # Queue priority per reason (higher is reviewed first; 0..=1000). Minor safety and sexual
  # content come first (AC-27.3).
  priorities:
    minor_safety: 100
    sexual: 90
    violence: 60
    hate: 50
    harassment: 50
    spam: 20
    other: 10

# Reporter reputation (T-143): each report adds
#   age_factor * (1 + reporter's actioned reports) / (1 + reporter's dismissed reports)
# to its queue item's weight, capped at max_weight. Weight only orders the queue; it never acts.
reputation:
  new_account_days: 7
  new_account_factor: 0.25
  guest_weight: 0.1
  max_weight: 3.0
