# Social rules (US-4, US-5, US-5a, US-6) — see crates/social/src/settings.rs and
# context/wiki/architecture/api-mvp.md. Minor-specific invite rules are region policy
# (config/policy/regions.yaml `invites`), not here.
version: 1

invites:
  # Personal invite links are `<url_base><token>`. Local web by default; deployments point it at the
  # share domain (the web landing page /i/<token>, T-48).
  url_base: 'http://localhost:3000/i/'

friends:
  # Friend cap per account (AC-5.2): checked when a request is sent and again when it is accepted.
  max: 20

requests:
  # Unanswered requests expire after this many days (AC-5.4).
  ttl_days: 14
  # Open requests a sender may have at once, and requests per rolling 24 hours (AC-5.3, 429 beyond).
  max_pending: 20
  daily_max: 30
  # Answered or expired requests and reset invites are deleted after this many days.
  retention_days: 30

search:
  # Every exact-handle search answer is padded to a multiple of this (found, missing and hidden
  # accounts take the same time, SR-19).
  latency_floor_ms: 150
  # A search result's `ref` can send a friend request for this long, by the searcher only.
  ref_ttl_secs: 600
