name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  repo-hygiene:
    name: Repo hygiene (English-only, wiki lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: English-only content (CLAUDE.md language rule)
        run: python3 tools/english_only.py
      - name: Context wiki lint (broken links, orphans, front matter)
        run: python3 tools/wiki_graph.py lint

  # Rust is split into parallel jobs; the "Rust (fmt, clippy, test)" job at the end aggregates them so the required
  # check name in branch protection stays the same.
  rust-lint:
    name: Rust lint (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-unit:
    name: Rust tests (crates, api unit, S3 adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REQUIRE_INTEGRATION_TESTS: '1'
      # S3 adapter tests (crates/media/tests/s3.rs) against MinIO, started below: service containers
      # cannot pass the `server` command. Same image as infra/docker-compose.yml.
      MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY_ID: ci-minio-user
      TEST_S3_SECRET_ACCESS_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start MinIO (S3-compatible storage for integration tests)
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            "$MINIO_IMAGE" server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test
      - name: Workspace tests except the api crate
        run: cargo test --workspace --exclude api --locked
      - name: api unit tests (lib and bins)
        run: cargo test -p api --lib --bins --locked
      - name: api doc tests
        run: cargo test -p api --doc --locked

  rust-api:
    name: Rust api integration tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Integration tests (apps/api/tests) use real Postgres and Valkey; images match infra/docker-compose.yml.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: cardsharing
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: cardsharing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardsharing -d cardsharing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1.11-alpine3.24
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_INTEGRATION_TESTS: '1'
      TEST_DATABASE_URL: postgres://cardsharing:ci-only-not-a-secret@127.0.0.1:5432/cardsharing
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test
      - run: cargo test -p api --test api --locked --no-run
      # Tests are dealt round-robin from the sorted list, so every test runs in exactly one shard, slow modules
      # are spread across shards, and new tests need no CI edit.
      - name: Run this shard's tests
        run: |
          cargo test -p api --test api --locked -q -- --list --format terse | sed -n 's/: test$//p' > all-tests.txt
          test -s all-tests.txt || { echo "::error::no api integration tests listed"; exit 1; }
          awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard' all-tests.txt > shard-tests.txt
          echo "Shard $SHARD/$SHARDS runs $(wc -l < shard-tests.txt) of $(wc -l < all-tests.txt) tests"
          test -s shard-tests.txt || exit 0
          xargs -a shard-tests.txt cargo test -p api --test api --locked -- --exact
      # T-3: the local seed command, run through the api binary against this job's Postgres and Valkey after the
      # production migrations, twice (it must be idempotent). One shard is enough.
      # D1: `api seed --reset` is refused with API_ENV=test before it writes anything, and with development it
      # leaves exactly the seed data (this shard's integration tests left many more accounts in the database).
      - name: Seed the local demo data (api migrate + api seed, api seed --reset)
        if: matrix.shard == 0
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          API_ENV: test
          DATABASE_URL: postgres://cardsharing:ci-only-not-a-secret@127.0.0.1:5432/cardsharing
          REDIS_URL: redis://127.0.0.1:6379/0
          # CI-only value (32 zero bytes), like .env.example; never used outside this job.
          API_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          API_CSAM_MATCHER: fake
          API_NUDITY_CLASSIFIER: fake
          API_MEDIA_STORAGE_DIR: ${{ runner.temp }}/seed-media
        run: |
          cargo run -q -p api --locked -- migrate
          cargo run -q -p api --locked -- seed > seed-1.txt
          cargo run -q -p api --locked -- seed > seed-2.txt
          grep -q '^Seeded 3 users, 3 new cards' seed-1.txt || grep -q '^Seeded 3 users, 0 new cards' seed-1.txt
          grep -q '^Seeded 3 users, 0 new cards' seed-2.txt
          echo "Seed ran twice: $(head -n 1 seed-2.txt)"
          count() { docker exec "$PG_CONTAINER" psql -U cardsharing -d cardsharing -tAc "SELECT count(*) FROM $1"; }
          sessions_before=$(count identity.sessions)
          test "$sessions_before" -ge 6
          if cargo run -q -p api --locked -- seed --reset > reset-refused.txt 2>&1; then
            echo "::error::api seed --reset ran with API_ENV=test"; cat reset-refused.txt; exit 1
          fi
          grep -q 'only runs with API_ENV=development (now test)' reset-refused.txt
          test "$(count identity.sessions)" -eq "$sessions_before"
          API_ENV=development cargo run -q -p api --locked -- seed --reset > reset.txt
          grep -q '^Reset: emptied [0-9]* tables' reset.txt
          grep -q '^Seeded 3 users, 3 new cards' reset.txt
          test "$(count identity.accounts)" -eq 3
          test "$(count identity.sessions)" -eq 3
          test "$(count cards.cards)" -eq 3
          cargo run -q -p api --locked -- seed > seed-3.txt
          grep -q '^Seeded 3 users, 0 new cards' seed-3.txt
          echo "Reset: $(head -n 1 reset.txt)"

  rust:
    name: Rust (fmt, clippy, test)
    if: always()
    needs: [rust-lint, rust-unit, rust-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Rust job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A Rust job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "Rust jobs passed"

  cargo-deny:
    name: Rust supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # JS is split into parallel jobs; the "JS (...)" job at the end aggregates them so the required check name stays.
  js-static:
    name: JS static (audit, format, lint, boundaries, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories in production deps; reviewed exceptions go in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
      # Rust advisories are covered by the cargo-deny job (RustSec database), so no separate cargo-audit step.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm typecheck

  js-test:
    name: JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  js-web:
    name: JS web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @card-sharing/web build

  # ADR-0009: the Expo app's web target (apps/mobile) must keep building; it bundles every screen for the browser.
  js-web-app:
    name: JS mobile web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @card-sharing/mobile build:web
      - name: The export holds the app and the self-hosted CanvasKit
        run: test -f apps/mobile/dist/index.html && test -f apps/mobile/dist/canvaskit.wasm

  js:
    name: JS (format, lint, boundaries, typecheck, test, web build)
    if: always()
    needs: [js-static, js-test, js-web, js-web-app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every JS job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A JS job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "JS jobs passed"

  # Sprint 10 phase 0, the browser E2E gate (e2e/web, testing-strategy.md): the app's web target served by Metro in
  # development mode, as testers run it (dev sign-in, plain-http API), against the real API and job worker on Postgres
  # and Valkey, with the fake AI provider, fake content scanners and filesystem media, driven by Playwright (Chromium,
  # two users at a time).
  e2e-web:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: cardsharing
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: cardsharing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardsharing -d cardsharing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1.11-alpine3.24
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Catches the sign-in emails (same image as infra/docker-compose.yml); the sign-up specs read them over its API.
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    # CI-only values (the zero keys match .env.example); never used outside this job. No RUST* or CARGO* names here:
    # rust-cache hashes those into its key, and this job reuses the rust-test cache.
    env:
      EXPO_NO_TELEMETRY: 1
      API_ENV: development
      API_BIND_ADDR: 127.0.0.1:8080
      API_CORS_ALLOWED_ORIGINS: http://127.0.0.1:8081
      DATABASE_URL: postgres://cardsharing:ci-only-not-a-secret@127.0.0.1:5432/cardsharing
      REDIS_URL: redis://127.0.0.1:6379/0
      API_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      API_MEDIA_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      API_MEDIA_BASE_URL: http://127.0.0.1:8080/v1/media-files
      API_MEDIA_STORAGE_DIR: .data/e2e-media
      API_CSAM_MATCHER: fake
      API_NUDITY_CLASSIFIER: fake
      API_AI_EFFECT_PROVIDER: fake
      API_PUSH_SENDER: fake
      API_CAPTCHA_VERIFIER: fake
      API_MAIL_TRANSPORT: smtp
      API_SMTP_HOST: 127.0.0.1
      API_SMTP_PORT: '1025'
      API_MAGIC_LINK_URL: http://127.0.0.1:8081/auth/link
      MAILPIT_URL: http://127.0.0.1:8025
      API_DEV_SIGN_IN: 'true'
      API_LOG_FORMAT: json
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      # The integration-test cache already holds the api binary's build (integration tests build the crate's bins);
      # read it only, so this job never replaces what the rust-api jobs saved.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test
          save-if: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the api binary
        run: cargo build -p api --bin api --locked
      # The seed prints development sessions: keep them out of the log (first line only), like the rust-api seed step.
      - name: Migrate and seed the database
        run: |
          target/debug/api migrate
          target/debug/api seed > seed.txt
          head -n 1 seed.txt
          rm seed.txt
      # config/signup.yaml gates sign-up behind invite codes; the sign-up specs use this one (masked in the log).
      - name: Mint an invite code for the sign-up specs
        run: |
          code=$(target/debug/api invites create --label e2e --uses 20 --days 1 | grep -oE '[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}' | head -n 1)
          test -n "$code"
          echo "::add-mask::$code"
          echo "E2E_INVITE_CODE=$code" >> "$GITHUB_ENV"
      - name: Start the API and the job worker
        env:
          RUST_LOG: info,api=debug,tower_http=info
        run: |
          mkdir -p e2e-logs
          nohup target/debug/api > e2e-logs/api.log 2>&1 &
          nohup target/debug/api worker > e2e-logs/worker.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/readyz > /dev/null && exit 0
            sleep 1
          done
          tail -n 100 e2e-logs/api.log
          exit 1
      # Metro in development mode, like `pnpm dev:mobile` on a tester's PC: `__DEV__` keeps the dev sign-in and allows
      # the plain-http API on loopback, and routes load as Metro's lazy bundles. (A static `expo export --dev` names
      # every route chunk with the same empty-content hash, so `card/[id]` and `board/[id]` overwrite each other.)
      - name: Start the app's web target (Metro, development)
        run: |
          node apps/mobile/scripts/copy-canvaskit.mjs
          nohup pnpm --filter @card-sharing/mobile run start --port 8081 > e2e-logs/metro.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf -H 'Accept: text/html' http://127.0.0.1:8081/ -o e2e-logs/index.html && break
            sleep 1
          done
          bundle=$(grep -o 'src="/[^"]*\.bundle[^"]*"' e2e-logs/index.html | head -n 1 | cut -d'"' -f2 | sed 's/&amp;/\&/g')
          test -n "$bundle" || { tail -n 100 e2e-logs/metro.log; exit 1; }
          # Build the web bundle now (about 25 s) while Chromium installs.
          nohup curl -sf "http://127.0.0.1:8081${bundle}" -o /dev/null > /dev/null 2>&1 &
      - name: Install Chromium (headless shell) for Playwright
        run: pnpm --filter @card-sharing/e2e-web run install-browser
      - name: Run the browser E2E suite
        run: pnpm --filter @card-sharing/e2e-web run e2e
      - name: API, worker and Metro logs
        if: failure()
        run: tail -n 200 e2e-logs/api.log e2e-logs/worker.log e2e-logs/metro.log
      - name: Upload the Playwright report, traces and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-report
          path: |
            e2e/web/playwright-report
            e2e/web/test-results
            e2e-logs
          retention-days: 7

  contract:
    name: API contract (OpenAPI → TS client drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @card-sharing/api-client...
      - run: pnpm api:client
      - name: Fail if the committed client is stale
        run: |
          git diff --exit-code -- packages/api-client || {
            echo "::error::OpenAPI/TS client out of date. Run 'pnpm api:client' and commit the result."
            exit 1
          }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose --exit-code 1
